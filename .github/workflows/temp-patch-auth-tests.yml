name: Temporary auth test migration

on:
  push:
    branches:
      - agent/security-real-web-sessions

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-real-web-sessions
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Update obsolete auth assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/cmd/server/auth_middleware_test.go')
          text = path.read_text()
          replacements = [
              (
          '''func TestAuthMiddleware_Enabled_AllowsNonEmptySessionCookie(t *testing.T) {
          \th := authMiddlewareHarness(t, true)
          \treq := rawRequest(http.MethodGet, "/api/saves")
          \treq.AddCookie(&http.Cookie{Name: "session", Value: "anything"})
          \trr := h.do(req)
          \tassertStatus(t, rr, http.StatusOK)
          }
          ''',
          '''func TestAuthMiddleware_Enabled_RejectsArbitrarySessionCookie(t *testing.T) {
          \th := authMiddlewareHarness(t, true)
          \treq := rawRequest(http.MethodGet, "/api/saves")
          \treq.AddCookie(&http.Cookie{Name: "session", Value: "anything"})
          \trr := h.do(req)
          \tassertStatus(t, rr, http.StatusUnauthorized)
          }
          ''',
              ),
              (
          '''func TestAuthMiddleware_Enabled_AllowsAuthLoginWithoutAuth(t *testing.T) {
          \th := authMiddlewareHarness(t, true)
          \treq := httptest.NewRequest(http.MethodPost, "/auth/login", strings.NewReader(`{}`))
          \treq.Header.Set("Content-Type", "application/json")
          \treq.Header.Set("X-CSRF-Protection", "1")
          \trr := h.do(req)
          \tassertStatus(t, rr, http.StatusOK)
          }
          ''',
          '''func TestAuthMiddleware_Enabled_AllowsCredentialedLoginWithoutExistingSession(t *testing.T) {
          \th := authMiddlewareHarness(t, true)
          \tt.Setenv("RSM_ADMIN_EMAIL", "admin@example.invalid")
          \tt.Setenv("RSM_ADMIN_PASSWORD", "correct-horse-battery-staple")
          \treq := httptest.NewRequest(http.MethodPost, "/auth/login", strings.NewReader(`{"email":"admin@example.invalid","password":"correct-horse-battery-staple"}`))
          \treq.Header.Set("Content-Type", "application/json")
          \treq.Header.Set("X-CSRF-Protection", "1")
          \trr := h.do(req)
          \tassertStatus(t, rr, http.StatusOK)
          }
          ''',
              ),
              (
          '''func TestAuthMiddleware_Enabled_AllowsAuthLoginPrefixVariants(t *testing.T) {
          \t// Compat-router mounts only — /api(/v1)/auth/login has no backing route
          \t// and is intentionally not part of the agent surface.
          \tfor _, path := range []string{
          \t\t"/auth/login",
          \t\t"/v1/auth/login",
          \t} {
          \t\tt.Run(path, func(t *testing.T) {
          \t\t\th := authMiddlewareHarness(t, true)
          \t\t\treq := httptest.NewRequest(http.MethodPost, path, strings.NewReader(`{}`))
          \t\t\treq.Header.Set("Content-Type", "application/json")
          \t\t\treq.Header.Set("X-CSRF-Protection", "1")
          \t\t\trr := h.do(req)
          \t\t\tassertStatus(t, rr, http.StatusOK)
          \t\t})
          \t}
          }
          ''',
          '''func TestAuthMiddleware_Enabled_AllowsAuthLoginPrefixVariants(t *testing.T) {
          \t// Compat-router mounts only — /api(/v1)/auth/login has no backing route
          \t// and is intentionally not part of the agent surface.
          \tfor _, path := range []string{
          \t\t"/auth/login",
          \t\t"/v1/auth/login",
          \t} {
          \t\tt.Run(path, func(t *testing.T) {
          \t\t\th := authMiddlewareHarness(t, true)
          \t\t\tt.Setenv("RSM_ADMIN_EMAIL", "admin@example.invalid")
          \t\t\tt.Setenv("RSM_ADMIN_PASSWORD", "correct-horse-battery-staple")
          \t\t\treq := httptest.NewRequest(http.MethodPost, path, strings.NewReader(`{"email":"admin@example.invalid","password":"correct-horse-battery-staple"}`))
          \t\t\treq.Header.Set("Content-Type", "application/json")
          \t\t\treq.Header.Set("X-CSRF-Protection", "1")
          \t\t\trr := h.do(req)
          \t\t\tassertStatus(t, rr, http.StatusOK)
          \t\t})
          \t}
          }
          ''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected auth middleware test block not found')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('backend/cmd/server/route_matrix_contract_test.go')
          text = path.read_text()
          old = '''\tcase "/auth/login":
          \t\treq.Body = jsonBody(t, map[string]any{"email": "internal@local", "password": "test", "device_type": "retroarch", "fingerprint": "seed-1"})
          \t\treq.ContentType = "application/json"
          '''
          new = '''\tcase "/auth/login":
          \t\tt.Setenv("RSM_ADMIN_EMAIL", "admin@example.invalid")
          \t\tt.Setenv("RSM_ADMIN_PASSWORD", "correct-horse-battery-staple")
          \t\treq.Body = jsonBody(t, map[string]any{"email": "admin@example.invalid", "password": "correct-horse-battery-staple", "device_type": "retroarch", "fingerprint": "seed-1"})
          \t\treq.ContentType = "application/json"
          '''
          if old not in text:
              raise SystemExit('expected route-matrix login fixture not found')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w backend/cmd/server/auth_middleware_test.go backend/cmd/server/route_matrix_contract_test.go backend/cmd/server/auth_web_sessions.go backend/cmd/server/auth_web_sessions_test.go backend/cmd/server/auth_handlers.go backend/cmd/server/auth_middleware.go backend/cmd/server/main.go backend/cmd/server/routes.go
      - name: Backend tests
        working-directory: backend
        run: go test ./...
      - name: Backend build
        working-directory: backend
        run: go build ./...
      - name: Commit migrated tests and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cmd/server
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'test(auth): migrate secure login expectations'
          git push origin HEAD:agent/security-real-web-sessions
