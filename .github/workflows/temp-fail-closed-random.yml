name: Temporary fail-closed randomness migration

on:
  push:
    branches:
      - agent/security-random-fail-closed

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-random-fail-closed
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply fail-closed randomness migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(pathname, old, new, label):
              path = Path(pathname)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found: {label}')
              path.write_text(text.replace(old, new, 1))

          # Demo-only credential may be deterministic; production seed state is
          # already removed when BOOTSTRAP_DEMO_DATA is disabled.
          replace(
              'backend/cmd/server/app_state.go',
              '\tseedSalt := randomHex(16)\n',
              '\tseedSalt := "bootstrap-demo-salt"\n',
              'demo seed salt',
          )

          path = Path('backend/cmd/server/security_state.go')
          text = path.read_text()
          text = text.replace('import (\n\t"crypto/rand"\n', 'import (\n\t"crypto/rand"\n\t"errors"\n', 1)
          text = text.replace('\t"fmt"\n\t"os"\n', '\t"fmt"\n\t"io"\n\t"os"\n', 1)

          old = '''func generateAppPasswordCompact() string {
          \tbuf := make([]byte, 6)
          \tif _, err := rand.Read(buf); err != nil {
          \t\treturn "ASDK9P"
          \t}
          \tout := make([]byte, 6)
          \tfor i, value := range buf {
          \t\tout[i] = appPasswordAlphabet[int(value)%len(appPasswordAlphabet)]
          \t}
          \treturn string(out)
          }
          '''
          new = '''func generateAppPasswordCompact() (string, error) {
          \treturn generateAppPasswordCompactFrom(rand.Reader)
          }

          func generateAppPasswordCompactFrom(reader io.Reader) (string, error) {
          \tif reader == nil {
          \t\treturn "", fmt.Errorf("app-password random reader is required")
          \t}
          \tbuf := make([]byte, 6)
          \tif _, err := io.ReadFull(reader, buf); err != nil {
          \t\treturn "", fmt.Errorf("read app-password randomness: %w", err)
          \t}
          \tout := make([]byte, 6)
          \tfor i, value := range buf {
          \t\tout[i] = appPasswordAlphabet[int(value)%len(appPasswordAlphabet)]
          \t}
          \treturn string(out), nil
          }
          '''
          if old not in text:
              raise SystemExit('expected block not found: generateAppPasswordCompact')
          text = text.replace(old, new, 1)

          old = '''func (a *app) generateUniqueAppPasswordCompactLocked() (string, bool) {
          \tfor attempt := 0; attempt < 64; attempt++ {
          \t\tcandidateCompact := generateAppPasswordCompact()
          \t\texists := false
          \t\tfor _, existing := range a.appPasswords {
          \t\t\tif verifyAppPasswordCompact(existing, candidateCompact) {
          \t\t\t\texists = true
          \t\t\t\tbreak
          \t\t\t}
          \t\t}
          \t\tif !exists {
          \t\t\treturn candidateCompact, true
          \t\t}
          \t}
          \treturn "", false
          }

          func (a *app) createAppPasswordLocked(name string, now time.Time) (appPassword, string) {
          \ttrimmedName := strings.TrimSpace(name)
          \tif trimmedName == "" {
          \t\ttrimmedName = "app-password"
          \t}

          \tid := a.nextAppPasswordID
          \ta.nextAppPasswordID++

          \tcompact, ok := a.generateUniqueAppPasswordCompactLocked()
          \tif !ok {
          \t\tcompact = "ASDK9P"
          \t}
          \tsalt := randomHex(16)
          \trecord := appPassword{
          \t\tID:                 "app-password-" + strconv.Itoa(id),
          \t\tName:               trimmedName,
          \t\tLastFour:           compact[len(compact)-4:],
          \t\tCreatedAt:          now.UTC(),
          \t\tBoundDeviceID:      nil,
          \t\tSyncAll:            true,
          \t\tAllowedSystemSlugs: nil,
          \t\tKeySalt:            salt,
          \t\tKeyHash:            hashAppPasswordCompact(salt, compact),
          \t}
          \ta.appPasswords[record.ID] = record
          \treturn record, formatAppPasswordCompact(compact)
          }
          '''
          new = '''var errAppPasswordCollisionExhausted = errors.New("unable to generate a unique app password")

          func (a *app) generateUniqueAppPasswordCompactLocked() (string, error) {
          \treturn a.generateUniqueAppPasswordCompactLockedWithReader(rand.Reader)
          }

          func (a *app) generateUniqueAppPasswordCompactLockedWithReader(reader io.Reader) (string, error) {
          \tfor attempt := 0; attempt < 64; attempt++ {
          \t\tcandidateCompact, err := generateAppPasswordCompactFrom(reader)
          \t\tif err != nil {
          \t\t\treturn "", err
          \t\t}
          \t\texists := false
          \t\tfor _, existing := range a.appPasswords {
          \t\t\tif verifyAppPasswordCompact(existing, candidateCompact) {
          \t\t\t\texists = true
          \t\t\t\tbreak
          \t\t\t}
          \t\t}
          \t\tif !exists {
          \t\t\treturn candidateCompact, nil
          \t\t}
          \t}
          \treturn "", errAppPasswordCollisionExhausted
          }

          func (a *app) createAppPasswordLocked(name string, now time.Time) (appPassword, string, error) {
          \treturn a.createAppPasswordLockedWithReader(name, now, rand.Reader)
          }

          func (a *app) createAppPasswordLockedWithReader(name string, now time.Time, reader io.Reader) (appPassword, string, error) {
          \ttrimmedName := strings.TrimSpace(name)
          \tif trimmedName == "" {
          \t\ttrimmedName = "app-password"
          \t}

          \tcompact, err := a.generateUniqueAppPasswordCompactLockedWithReader(reader)
          \tif err != nil {
          \t\treturn appPassword{}, "", err
          \t}
          \tsalt, err := randomHexFrom(reader, 16)
          \tif err != nil {
          \t\treturn appPassword{}, "", fmt.Errorf("generate app-password salt: %w", err)
          \t}

          \t// Allocate the durable identity only after all credential material was
          \t// generated successfully. Entropy/collision failures must not consume IDs.
          \tid := a.nextAppPasswordID
          \ta.nextAppPasswordID++
          \trecord := appPassword{
          \t\tID:                 "app-password-" + strconv.Itoa(id),
          \t\tName:               trimmedName,
          \t\tLastFour:           compact[len(compact)-4:],
          \t\tCreatedAt:          now.UTC(),
          \t\tBoundDeviceID:      nil,
          \t\tSyncAll:            true,
          \t\tAllowedSystemSlugs: nil,
          \t\tKeySalt:            salt,
          \t\tKeyHash:            hashAppPasswordCompact(salt, compact),
          \t}
          \ta.appPasswords[record.ID] = record
          \treturn record, formatAppPasswordCompact(compact), nil
          }
          '''
          if old not in text:
              raise SystemExit('expected block not found: unique/create app password')
          path.write_text(text.replace(old, new, 1))

          replace(
              'backend/cmd/server/auth_extra_handlers.go',
          '''\ta.mu.Lock()
          \trecord, plainTextKey = a.createAppPasswordLocked(name, now)
          \tpublicRecord := a.publicAppPasswordLocked(record)
          \t_ = a.persistSecurityDeviceStateLocked()
          \ta.mu.Unlock()
          ''',
          '''\ta.mu.Lock()
          \tvar err error
          \trecord, plainTextKey, err = a.createAppPasswordLocked(name, now)
          \tif err != nil {
          \t\ta.mu.Unlock()
          \t\twriteJSON(w, http.StatusInternalServerError, apiError{Error: "Internal Server Error", Message: "unable to generate app password", StatusCode: http.StatusInternalServerError})
          \t\treturn
          \t}
          \tpublicRecord := a.publicAppPasswordLocked(record)
          \t_ = a.persistSecurityDeviceStateLocked()
          \ta.mu.Unlock()
          ''',
              'manual app-password creation',
          )

          path = Path('backend/cmd/server/auth_handlers.go')
          text = path.read_text()
          old = '''func (a *app) handleAuthToken(w http.ResponseWriter, r *http.Request) {
          \t_ = requestPrincipal(r)

          \twriteJSON(w, http.StatusOK, tokenResponse{
          \t\tSuccess:       true,
          \t\tToken:         randomHex(64),
          \t\tExpiresInDays: 7,
          \t})
          }
          '''
          new = '''func (a *app) handleAuthToken(w http.ResponseWriter, r *http.Request) {
          \t_ = requestPrincipal(r)

          \ttoken, err := randomHex(64)
          \tif err != nil {
          \t\twriteJSON(w, http.StatusInternalServerError, apiError{Error: "Internal Server Error", Message: "unable to generate token", StatusCode: http.StatusInternalServerError})
          \t\treturn
          \t}
          \twriteJSON(w, http.StatusOK, tokenResponse{
          \t\tSuccess:       true,
          \t\tToken:         token,
          \t\tExpiresInDays: 7,
          \t})
          }
          '''
          if old not in text:
              raise SystemExit('expected block not found: auth token')
          text = text.replace(old, new, 1)

          old = '''\tif deviceType == "" && fingerprint == "" {
          \t\twriteJSON(w, http.StatusOK, tokenResponse{
          \t\t\tSuccess:       true,
          \t\t\tToken:         randomHex(64),
          \t\t\tExpiresInDays: 7,
          \t\t})
          \t\treturn
          \t}
          '''
          new = '''\tif deviceType == "" && fingerprint == "" {
          \t\ttoken, err := randomHex(64)
          \t\tif err != nil {
          \t\t\twriteJSON(w, http.StatusInternalServerError, apiError{Error: "Internal Server Error", Message: "unable to generate token", StatusCode: http.StatusInternalServerError})
          \t\t\treturn
          \t\t}
          \t\twriteJSON(w, http.StatusOK, tokenResponse{
          \t\t\tSuccess:       true,
          \t\t\tToken:         token,
          \t\t\tExpiresInDays: 7,
          \t\t})
          \t\treturn
          \t}
          '''
          if old not in text:
              raise SystemExit('expected block not found: app password legacy token')
          text = text.replace(old, new, 1)

          old = '''\tif existingKeyID, hasExistingKey := a.appPasswordIDForDeviceLocked(deviceRecord.ID); hasExistingKey {
          \t\tdelete(a.appPasswords, existingKeyID)
          \t}

          \tname := strings.TrimSpace(payload.Name)
          \tif name == "" {
          \t\tname = defaultDeviceDisplayName(deviceType, fingerprint)
          \t}
          \tcreatedRecord, plainTextKey := a.createAppPasswordLocked(name, now)
          \ta.bindAppPasswordToDeviceLocked(createdRecord.ID, deviceRecord)
          '''
          new = '''\tname := strings.TrimSpace(payload.Name)
          \tif name == "" {
          \t\tname = defaultDeviceDisplayName(deviceType, fingerprint)
          \t}
          \tcreatedRecord, plainTextKey, err := a.createAppPasswordLocked(name, now)
          \tif err != nil {
          \t\twriteJSON(w, http.StatusInternalServerError, apiError{Error: "Internal Server Error", Message: "unable to generate app password", StatusCode: http.StatusInternalServerError})
          \t\treturn
          \t}
          \t// Do not invalidate a device's existing credential until a replacement
          \t// has been generated successfully.
          \tif existingKeyID, hasExistingKey := a.appPasswordIDForDeviceLocked(deviceRecord.ID); hasExistingKey && existingKeyID != createdRecord.ID {
          \t\tdelete(a.appPasswords, existingKeyID)
          \t}
          \ta.bindAppPasswordToDeviceLocked(createdRecord.ID, deviceRecord)
          '''
          if old not in text:
              raise SystemExit('expected block not found: auto-enrollment replacement')
          text = text.replace(old, new, 1)

          old = '''func (a *app) handleAuthDevice(w http.ResponseWriter, r *http.Request) {
          \t_ = requestPrincipal(r)

          \tuserCode := strings.ToUpper(randomHex(2))
          \twriteJSON(w, http.StatusOK, map[string]any{
          \t\t"deviceCode":       randomHex(32),
          \t\t"userCode":         userCode,
          \t\t"verificationUri":  baseURLForRequest(r) + "/device/" + userCode,
          \t\t"expiresInSeconds": 900,
          \t})
          }
          '''
          new = '''func (a *app) handleAuthDevice(w http.ResponseWriter, r *http.Request) {
          \t_ = requestPrincipal(r)

          \tuserCodeRaw, err := randomHex(2)
          \tif err != nil {
          \t\twriteJSON(w, http.StatusInternalServerError, apiError{Error: "Internal Server Error", Message: "unable to generate device code", StatusCode: http.StatusInternalServerError})
          \t\treturn
          \t}
          \tdeviceCode, err := randomHex(32)
          \tif err != nil {
          \t\twriteJSON(w, http.StatusInternalServerError, apiError{Error: "Internal Server Error", Message: "unable to generate device code", StatusCode: http.StatusInternalServerError})
          \t\treturn
          \t}
          \tuserCode := strings.ToUpper(userCodeRaw)
          \twriteJSON(w, http.StatusOK, map[string]any{
          \t\t"deviceCode":       deviceCode,
          \t\t"userCode":         userCode,
          \t\t"verificationUri":  baseURLForRequest(r) + "/device/" + userCode,
          \t\t"expiresInSeconds": 900,
          \t})
          }
          '''
          if old not in text:
              raise SystemExit('expected block not found: device code')
          path.write_text(text.replace(old, new, 1))

          path = Path('backend/cmd/server/helper_auth.go')
          text = path.read_text()
          old = '''\t\tif status != 0 {
          \t\t\terrorLabel := "Unauthorized"
          \t\t\tif status == http.StatusBadRequest {
          \t\t\t\terrorLabel = "Bad Request"
          \t\t\t} else if status == http.StatusForbidden {
          \t\t\t\terrorLabel = "Forbidden"
          \t\t\t}
          '''
          new = '''\t\tif status != 0 {
          \t\t\terrorLabel := "Unauthorized"
          \t\t\tif status == http.StatusBadRequest {
          \t\t\t\terrorLabel = "Bad Request"
          \t\t\t} else if status == http.StatusForbidden {
          \t\t\t\terrorLabel = "Forbidden"
          \t\t\t} else if status == http.StatusInternalServerError {
          \t\t\t\terrorLabel = "Internal Server Error"
          \t\t\t}
          '''
          if old not in text:
              raise SystemExit('expected block not found: helper error label')
          text = text.replace(old, new, 1)
          old = '''\tname := defaultDeviceDisplayName(identity.DeviceType, identity.Fingerprint)
          \trecord, plainTextKey := a.createAppPasswordLocked(name, now)
          \ta.bindAppPasswordToDeviceLocked(record.ID, boundDevice)
          '''
          new = '''\tname := defaultDeviceDisplayName(identity.DeviceType, identity.Fingerprint)
          \trecord, plainTextKey, err := a.createAppPasswordLocked(name, now)
          \tif err != nil {
          \t\treturn helperAuthContext{}, http.StatusInternalServerError, "unable to generate app password"
          \t}
          \ta.bindAppPasswordToDeviceLocked(record.ID, boundDevice)
          '''
          if old not in text:
              raise SystemExit('expected block not found: helper auto credential')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w backend/cmd/server/*.go
      - name: Backend tests
        working-directory: backend
        run: go test ./...
      - name: Backend build
        working-directory: backend
        run: go build ./...
      - name: Security grep
        run: |
          if rg -n 'return "ASDK9P"|compact = "ASDK9P"|return "seed"' backend/cmd/server; then
            echo 'Predictable credential fallback remains'
            exit 1
          fi
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cmd/server
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(security): fail closed on random generation errors'
          git push origin HEAD:agent/security-random-fail-closed
