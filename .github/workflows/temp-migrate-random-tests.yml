name: Temporary randomness test signature migration

on:
  push:
    branches:
      - agent/security-random-fail-closed

permissions:
  contents: write

jobs:
  migrate-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-random-fail-closed
          fetch-depth: 0
      - name: Migrate test call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/cmd/server/auth_middleware_test.go')
          text = path.read_text()
          old = '''\th.app.mu.Lock()
          \t_, key := h.app.createAppPasswordLocked("middleware-test", time.Now().UTC())
          \th.app.mu.Unlock()
          '''
          new = '''\th.app.mu.Lock()
          \t_, key, err := h.app.createAppPasswordLocked("middleware-test", time.Now().UTC())
          \th.app.mu.Unlock()
          \tif err != nil {
          \t\tt.Fatalf("create app password: %v", err)
          \t}
          '''
          if old not in text:
              raise SystemExit('auth middleware test call site not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('backend/cmd/server/helper_auth_device_binding_test.go')
          text = path.read_text()
          replacements = [
              (
          '''\trecord, plain := a.createAppPasswordLocked("test-helper", now)
          \t_, compact, ok := normalizeAppPasswordInput(plain)
          ''',
          '''\trecord, plain, err := a.createAppPasswordLocked("test-helper", now)
          \tif err != nil {
          \t\tt.Fatalf("create helper app password: %v", err)
          \t}
          \t_, compact, ok := normalizeAppPasswordInput(plain)
          ''',
              ),
              (
          '''\told, _ := a.createAppPasswordLocked("old", now)
          \ta.bindAppPasswordToDeviceLocked(old.ID, a.devices[1])
          \tfresh, _ := a.createAppPasswordLocked("fresh", now)
          ''',
          '''\told, _, err := a.createAppPasswordLocked("old", now)
          \tif err != nil {
          \t\tt.Fatalf("create old app password: %v", err)
          \t}
          \ta.bindAppPasswordToDeviceLocked(old.ID, a.devices[1])
          \tfresh, _, err := a.createAppPasswordLocked("fresh", now)
          \tif err != nil {
          \t\tt.Fatalf("create fresh app password: %v", err)
          \t}
          ''',
              ),
              (
          '''\tshared, _ := a.createAppPasswordLocked("shared", now)
          \tsharedID := shared.ID
          ''',
          '''\tshared, _, err := a.createAppPasswordLocked("shared", now)
          \tif err != nil {
          \t\tt.Fatalf("create shared app password: %v", err)
          \t}
          \tsharedID := shared.ID
          ''',
              ),
              (
          '''\tfresh, _ := a.createAppPasswordLocked("fresh", now)
          \ta.bindAppPasswordToDeviceLocked(fresh.ID, a.devices[1])
          ''',
          '''\tfresh, _, err := a.createAppPasswordLocked("fresh", now)
          \tif err != nil {
          \t\tt.Fatalf("create fresh app password: %v", err)
          \t}
          \ta.bindAppPasswordToDeviceLocked(fresh.ID, a.devices[1])
          ''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('helper auth test call site not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          gofmt -w backend/cmd/server/auth_middleware_test.go backend/cmd/server/helper_auth_device_binding_test.go
      - name: Commit migrated tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cmd/server/auth_middleware_test.go backend/cmd/server/helper_auth_device_binding_test.go
          git commit -m 'test(security): handle app-password generation errors'
          git push origin HEAD:agent/security-random-fail-closed
