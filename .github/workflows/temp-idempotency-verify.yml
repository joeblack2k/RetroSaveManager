name: Temporary idempotency verifier

on:
  push:
    branches:
      - agent/save-idempotency

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/save-idempotency
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: gofmt -w backend/cmd/server/save_idempotency.go backend/cmd/server/save_idempotency_test.go backend/cmd/server/routes.go
      - name: Backend tests
        working-directory: backend
        run: go test ./...
      - name: Backend build
        working-directory: backend
        run: go build ./...
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cmd/server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(sync): verify idempotent save uploads'
          git push origin HEAD:agent/save-idempotency
