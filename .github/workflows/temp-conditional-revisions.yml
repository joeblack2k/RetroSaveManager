name: Temporary conditional revision migration

on:
  push:
    branches:
      - agent/save-conditional-revisions

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/save-conditional-revisions
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Wire conditional revisions into save handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/cmd/server/save_handlers.go')
          text = path.read_text()

          anchor = '''func (a *app) handleSaveLatest(w http.ResponseWriter, r *http.Request) {
          \t_ = requestPrincipal(r)
          '''
          replacement = '''func (a *app) handleSaveLatest(w http.ResponseWriter, r *http.Request) {
          \t_ = requestPrincipal(r)
          \tw.Header().Set(conditionalWritesHeader, "supported")
          '''
          if anchor not in text:
              raise SystemExit('latest handler anchor not found')
          text = text.replace(anchor, replacement, 1)

          old_blocks = [
          '''\t\t\t\tif found {
          \t\t\t\t\twriteJSON(w, http.StatusOK, map[string]any{
          \t\t\t\t\t\t"success": true,
          \t\t\t\t\t\t"exists":  true,
          \t\t\t\t\t\t"sha256":  latest.Summary.SHA256,
          \t\t\t\t\t\t"version": latest.Summary.Version,
          \t\t\t\t\t\t"id":      latest.Summary.ID,
          \t\t\t\t\t\t"format":  saveRecordFormat(latest),
          \t\t\t\t\t})
          \t\t\t\t\treturn
          \t\t\t\t}
          ''',
          '''\t\t\t\t\tif found && saveRecordPayloadExists(latest) {
          \t\t\t\t\t\twriteJSON(w, http.StatusOK, map[string]any{
          \t\t\t\t\t\t\t"success": true,
          \t\t\t\t\t\t\t"exists":  true,
          \t\t\t\t\t\t\t"sha256":  latest.Summary.SHA256,
          \t\t\t\t\t\t\t"version": latest.Summary.Version,
          \t\t\t\t\t\t\t"id":      latest.Summary.ID,
          \t\t\t\t\t\t\t"format":  saveRecordFormat(latest),
          \t\t\t\t\t\t})
          \t\t\t\t\t\treturn
          \t\t\t\t\t}
          ''',
          '''\t\twriteJSON(w, http.StatusOK, map[string]any{
          \t\t\t"success": true,
          \t\t\t"exists":  true,
          \t\t\t"sha256":  shaValue,
          \t\t\t"version": latest.Summary.Version,
          \t\t\t"id":      latest.Summary.ID,
          \t\t\t"format":  saveRecordFormat(latest),
          \t\t})
          \t\treturn
          ''',
          ]
          new_blocks = [
          '''\t\t\t\tif found {
          \t\t\t\t\twriteLatestSaveRecord(w, latest, latest.Summary.SHA256)
          \t\t\t\t\treturn
          \t\t\t\t}
          ''',
          '''\t\t\t\t\tif found && saveRecordPayloadExists(latest) {
          \t\t\t\t\t\twriteLatestSaveRecord(w, latest, latest.Summary.SHA256)
          \t\t\t\t\t\treturn
          \t\t\t\t\t}
          ''',
          '''\t\twriteLatestSaveRecord(w, latest, shaValue)
          \t\treturn
          ''',
          ]
          for old, new in zip(old_blocks, new_blocks):
              if old not in text:
                  raise SystemExit('expected latest response block not found')
              text = text.replace(old, new, 1)

          anchor = '''\t\tfilename := header.Filename
          \t\tif expandedUploads, isArchive, expandErr := expandMultipartSaveUpload(filename, payload, formValue); isArchive {
          '''
          replacement = '''\t\tfilename := header.Filename
          \t\tif !a.enforceSaveWritePrecondition(w, r, helperCtx, formValue, filename) {
          \t\t\treturn
          \t\t}
          \t\tif expandedUploads, isArchive, expandErr := expandMultipartSaveUpload(filename, payload, formValue); isArchive {
          '''
          if anchor not in text:
              raise SystemExit('upload filename anchor not found')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
          gofmt -w backend/cmd/server/save_handlers.go backend/cmd/server/save_preconditions.go backend/cmd/server/save_preconditions_test.go
      - name: Backend tests with focused diagnostics
        working-directory: backend
        shell: bash
        run: |
          set +e
          go test -json ./... > /tmp/rsm-go-test.json
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          events=[]
          failed=set()
          for raw in Path('/tmp/rsm-go-test.json').read_text(errors='replace').splitlines():
              try: e=json.loads(raw)
              except Exception: continue
              events.append(e)
              if e.get('Action') == 'fail' and e.get('Test'):
                  failed.add(e['Test'])
          out=['FAILED TESTS:'] + (sorted(failed) or ['<package-level failure>']) + ['']
          for e in events:
              s=e.get('Output','')
              if e.get('Test') in failed or 'undefined:' in s or '_test.go:' in s or 'FAIL' in s or 'mismatch' in s.lower() or 'want ' in s.lower() or 'expected ' in s.lower():
                  if s: out.append(f"[{e.get('Test') or 'package'}] {s.rstrip()}")
          Path('../.github/TEMP_CONDITIONAL_REVISION_FAILURE.txt').write_text('\n'.join(out)+'\n')
          PY
            git -C .. config user.name 'github-actions[bot]'
            git -C .. config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C .. add .github/TEMP_CONDITIONAL_REVISION_FAILURE.txt
            git -C .. commit -m 'ci: capture temporary conditional revision failure'
            git -C .. push origin HEAD:agent/save-conditional-revisions
            exit "$status"
          fi
      - name: Backend build
        working-directory: backend
        run: go build ./...
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cmd/server
          git commit -m 'feat(sync): enforce conditional save revisions'
          git push origin HEAD:agent/save-conditional-revisions
